apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
  - name: canary-hash
  metrics:
  - name: success-rate
    interval: 15s
    count: 4
    failureLimit: 0
    successCondition: len(result) == 0 || isNaN(result[0]) || result[0] >= 0.95
    provider:
      prometheus:
        address: http://prometheus-server.monitoring.svc.cluster.local
        query: |
          sum(rate(http_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}",status="200"}[30s])) / sum(rate(http_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[30s]))